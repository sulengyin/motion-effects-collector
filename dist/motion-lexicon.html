<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动效收集器 · Motion Lexicon</title>
<style>
:root{
  --bg:#07080b; --surface:#0e1015; --surface2:#12151b; --header:rgba(7,8,11,.74);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.17);
  --tx:#e9ecf3; --tx2:#98a0b2; --tx3:#666e82;
  --accent:#8b8cff; --accent2:#43d9ff; --stage:#0a0c11;
  --shadow:0 24px 60px rgba(0,0,0,.55);
  --e-out:cubic-bezier(.22,1,.36,1); --e-soft:cubic-bezier(.4,0,.2,1);
  --glow:rgba(140,150,255,.10);
}
html[data-theme="light"]{
  --bg:#f2f3f7; --surface:#ffffff; --surface2:#f7f8fb; --header:rgba(247,248,251,.82);
  --line:rgba(12,16,28,.1); --line2:rgba(12,16,28,.22);
  --tx:#12141c; --tx2:#565d6e; --tx3:#8b91a1;
  --shadow:0 18px 44px rgba(20,25,40,.12);
  --glow:rgba(110,120,255,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background-color .4s var(--e-soft),color .4s var(--e-soft);
}
/* 背景光场：极缓慢漂移，给静态页面一点"呼吸" */
.aura{
  position:fixed; inset:-18%; z-index:0; pointer-events:none;
  background:
    radial-gradient(42% 36% at 18% 16%, rgba(80,90,255,.16), transparent 70%),
    radial-gradient(38% 32% at 84% 6%, rgba(0,190,255,.11), transparent 70%),
    radial-gradient(40% 34% at 62% 92%, rgba(255,77,141,.055), transparent 72%);
  animation:ui-aura 26s var(--e-soft) infinite alternate;
  will-change:transform;
}
html[data-theme="light"] .aura{
  background:
    radial-gradient(42% 36% at 18% 16%, rgba(120,130,255,.13), transparent 70%),
    radial-gradient(38% 32% at 84% 6%, rgba(0,180,255,.10), transparent 70%),
    radial-gradient(40% 34% at 62% 92%, rgba(255,120,170,.07), transparent 72%);
}
@keyframes ui-aura{
  from{transform:translate3d(-1.5%,-1%,0) scale(1)}
  to{transform:translate3d(2.5%,1.5%,0) scale(1.07)}
}
::selection{background:rgba(120,140,255,.35)}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:20px;
  padding:14px 28px;
  background:var(--header);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  transition:background-color .3s var(--e-soft),border-color .3s var(--e-soft),box-shadow .3s var(--e-soft);
  animation:ui-head-in .6s var(--e-out) backwards;
}
@keyframes ui-head-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.top.scrolled{box-shadow:0 10px 30px rgba(0,0,0,.28);border-bottom-color:var(--line2)}
html[data-theme="light"] .top.scrolled{box-shadow:0 10px 28px rgba(20,25,40,.08)}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.mark{
  width:24px;height:24px;border-radius:50%;flex:none;
  background:conic-gradient(from 0deg,#43d9ff,#8b7cff,#ff4d8d,#43d9ff);
  -webkit-mask:radial-gradient(circle,transparent 8px,#000 9px);
  mask:radial-gradient(circle,transparent 8px,#000 9px);
  animation:ui-mark-spin 7s linear infinite;
}
@keyframes ui-mark-spin{to{transform:rotate(1turn)}}
.brand h1{font-size:15px;font-weight:650;margin:0;letter-spacing:.01em}
.brand p{font:400 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tx3);margin:4px 0 0;letter-spacing:.1em}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:13px;height:13px;stroke:var(--tx3);fill:none;stroke-width:1.8;pointer-events:none}
.search input{
  width:272px; padding:9px 12px 9px 32px;
  background:var(--surface2); color:var(--tx);
  border:1px solid var(--line); border-radius:10px;
  font-size:12.5px; font-family:inherit; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search input::placeholder{color:var(--tx3)}
.search input:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(120,140,255,.14)}
.ghost{
  background:var(--surface2); color:var(--tx2);
  border:1px solid var(--line); border-radius:10px;
  padding:9px 12px; font-size:12px; font-family:inherit;
  cursor:pointer; white-space:nowrap;
  transition:color .2s var(--e-soft),border-color .2s var(--e-soft),background-color .2s var(--e-soft),transform .18s var(--e-out);
}
.ghost:hover{color:var(--tx);border-color:var(--line2);transform:translateY(-1px)}
.ghost:active{transform:translateY(0) scale(.97);transition-duration:.08s}
.ghost[aria-pressed="true"]{color:var(--accent2);border-color:rgba(67,217,255,.4);background:rgba(67,217,255,.08)}

/* ---------- layout ---------- */
main{
  position:relative; z-index:1;
  display:grid; grid-template-columns:172px minmax(0,1fr);
  gap:28px; padding:26px 28px 60px; max-width:1560px; margin:0 auto;
  align-items:start;
}
.rail{position:sticky;top:86px;display:flex;flex-direction:column;gap:2px}
.rail .rl{
  font:400 9.5px/1 ui-monospace,monospace;color:var(--tx3);
  letter-spacing:.16em;margin:0 0 10px 10px;
}
.chip{
  display:flex;align-items:center;gap:8px;
  background:none;border:0;border-radius:9px;
  padding:9px 10px;cursor:pointer;text-align:left;
  color:var(--tx2);font-size:12.5px;font-family:inherit;
  transition:background-color .2s var(--e-soft),color .2s var(--e-soft),transform .25s var(--e-out);
  animation:ui-rail-in .5s var(--e-out) backwards; animation-delay:var(--d,0ms);
}
@keyframes ui-rail-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.chip:hover{background:var(--surface2);color:var(--tx);transform:translateX(2px)}
.chip:active{transform:translateX(2px) scale(.98)}
.chip .n{
  margin-left:auto;font:400 9.5px/1 ui-monospace,monospace;
  color:var(--tx3);min-width:14px;text-align:right;
  transition:color .2s var(--e-soft);
}
.chip[aria-pressed="true"]{background:var(--surface2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed="true"] .n{color:var(--accent2)}
.chip[aria-pressed="true"]::before{
  content:"";width:3px;height:3px;border-radius:50%;
  background:var(--accent2);box-shadow:0 0 8px var(--accent2);
  animation:ui-dot .4s var(--e-out);
}
@keyframes ui-dot{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.card{
  position:relative; isolation:isolate;
  background:var(--surface); border:1px solid var(--line);
  border-radius:16px; overflow:hidden; cursor:pointer;
  transition:transform .42s var(--e-out),border-color .3s var(--e-soft),box-shadow .42s var(--e-out),background-color .35s var(--e-soft);
  animation:ui-card-in .6s var(--e-out) backwards; animation-delay:var(--d,0ms);
}
@keyframes ui-card-in{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
/* 跟随鼠标的柔光，替代生硬的高亮 */
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%), var(--glow), transparent 72%);
  opacity:0;transition:opacity .35s var(--e-soft);
}
.card:hover::after{opacity:1}
.card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:var(--shadow)}
.card:active{transform:translateY(-1px) scale(.994);transition-duration:.12s}
.card:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.stage{
  height:186px; display:grid; place-items:center; position:relative; overflow:hidden;
  background-color:var(--stage);
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:18px 18px;
  border-bottom:1px solid var(--line);
  transition:background-position .7s var(--e-out);
}
.card:hover .stage{background-position:7px 7px}
.card-body{padding:13px 15px 15px}
.card-top{display:flex;align-items:center;gap:8px}
.card-top h3{margin:0;font-size:14.5px;font-weight:620;letter-spacing:.01em}
.badge{
  margin-left:auto;font:400 9.5px/1 ui-monospace,monospace;
  color:var(--tx3);letter-spacing:.08em;
  border:1px solid var(--line);border-radius:5px;padding:3px 6px;flex:none;
}
.card-en{margin:5px 0 0;font:400 10px/1 ui-monospace,monospace;color:var(--tx3);letter-spacing:.06em}
.card-def{
  margin:9px 0 0;font-size:12.5px;line-height:1.68;color:var(--tx2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-foot{display:flex;align-items:center;gap:6px;margin-top:13px}
.kw{
  font:400 9.5px/1 ui-monospace,monospace;color:var(--tx3);
  background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:4px 6px;
}
.kw.more{color:var(--tx3)}
.tune{
  margin-left:auto;background:none;border:0;padding:2px 0;cursor:pointer;
  font:400 11px/1 inherit;color:var(--accent);opacity:.75;
  transition:opacity .2s var(--e-soft),transform .28s var(--e-out);
}
.card:hover .tune{opacity:1;transform:translateX(2px)}

/* ---------- empty / footer ---------- */
.empty{
  padding:60px 20px;text-align:center;color:var(--tx3);
  border:1px dashed var(--line);border-radius:16px;font-size:13px;
  animation:ui-fade .45s var(--e-out) backwards;
}
@keyframes ui-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty b{display:block;color:var(--tx2);margin-bottom:8px;font-weight:500;font-size:14px}
.ingest{
  margin-top:44px;padding:24px 26px;border:1px solid var(--line);
  border-radius:16px;background:var(--surface);
  display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;
  animation:ui-fade .6s var(--e-out) .12s backwards;
  transition:background-color .35s var(--e-soft),border-color .3s var(--e-soft);
}
.ingest h2{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.02em}
.ingest p{margin:0;font-size:12.5px;line-height:1.7;color:var(--tx2);max-width:520px}
.ingest .flow{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  font:400 10px/1 ui-monospace,monospace;color:var(--tx3);letter-spacing:.05em;flex-wrap:wrap;
}
.ingest .flow s{text-decoration:none;color:var(--line2)}
.tips{margin-top:12px;font:400 10.5px/1.7 ui-monospace,monospace;color:var(--tx3)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:22px}
.modal[hidden]{display:none}
.mbd{
  position:absolute;inset:0;background:rgba(0,0,0,.62);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  animation:ui-veil .3s var(--e-soft) backwards;
}
@keyframes ui-veil{from{opacity:0}to{opacity:1}}
.panel{
  position:relative;width:min(1010px,100%);max-height:88vh;
  background:var(--surface);border:1px solid var(--line2);border-radius:20px;
  display:grid;grid-template-columns:1.02fr .98fr;overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.62);
  animation:ui-panel .46s cubic-bezier(.16,1.02,.3,1) backwards;
  transition:opacity .16s var(--e-soft),transform .16s var(--e-soft);
}
@keyframes ui-panel{from{opacity:0;transform:translateY(18px) scale(.975)}to{opacity:1;transform:none}}
.modal.closing .mbd{opacity:0;transition:opacity .16s var(--e-soft)}
.modal.closing .panel{opacity:0;transform:translateY(6px) scale(.99)}
/* 弹窗内容按层进入，避免"啪"地整块出现 */
.p-right > *{animation:ui-fade .5s var(--e-out) backwards}
.p-right > *:nth-child(1){animation-delay:.07s}
.p-right > *:nth-child(2){animation-delay:.12s}
.p-right > *:nth-child(3){animation-delay:.17s}
.p-right > *:nth-child(4){animation-delay:.21s}
.p-right > *:nth-child(5){animation-delay:.25s}
.p-right > *:nth-child(6){animation-delay:.29s}
.params .prow{animation:ui-fade .42s var(--e-out) backwards}
.params .prow:nth-child(1){animation-delay:.1s}
.params .prow:nth-child(2){animation-delay:.15s}
.params .prow:nth-child(3){animation-delay:.2s}
.params .prow:nth-child(4){animation-delay:.25s}
.params .prow:nth-child(5){animation-delay:.3s}
.x{
  position:absolute;top:12px;right:12px;z-index:5;
  width:26px;height:26px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--tx2);cursor:pointer;
  font-size:14px;line-height:1;display:grid;place-items:center;
}
.x:hover{color:var(--tx);border-color:var(--line2)}
.p-left{padding:18px;border-right:1px solid var(--line);min-width:0}
.m-stage{
  height:296px;border-radius:14px;display:grid;place-items:center;
  background-color:var(--stage);
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:18px 18px;
  border:1px solid var(--line);overflow:hidden;position:relative;
}
.params{margin-top:16px;display:flex;flex-direction:column;gap:11px}
.prow{display:grid;grid-template-columns:74px 1fr 48px;align-items:center;gap:12px}
.pl{font-size:11.5px;color:var(--tx2)}
.pv{font:400 10.5px/1 ui-monospace,monospace;color:var(--accent2);text-align:right}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:3px;border-radius:3px;
  background:var(--line2);outline:none;width:100%;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--tx);border:2px solid var(--surface);cursor:pointer;
  box-shadow:0 0 0 1px var(--line2);
}
input[type=range]::-moz-range-thumb{
  width:11px;height:11px;border-radius:50%;background:var(--tx);
  border:2px solid var(--surface);cursor:pointer;
}
.p-right{padding:22px 24px 24px;overflow-y:auto;min-width:0}
.p-right::-webkit-scrollbar{width:8px}
.p-right::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.ptitle{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding-right:24px}
.ptitle h2{margin:0;font-size:21px;font-weight:640;letter-spacing:.01em}
.ptitle span{font:400 10.5px/1 ui-monospace,monospace;color:var(--tx3);letter-spacing:.06em}
.pdef{margin:14px 0 0;font-size:13px;line-height:1.78;color:var(--tx2)}
.sect{margin-top:19px}
.sect h3{
  margin:0 0 9px;font:400 9.5px/1 ui-monospace,monospace;
  color:var(--tx3);letter-spacing:.18em;
}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font:400 10.5px/1 ui-monospace,monospace;color:var(--tx2);
  background:var(--surface2);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;
}
.note{font-size:12px;line-height:1.75;color:var(--tx2);margin:0}
.note b{color:var(--tx);font-weight:550}
.codebox{position:relative;margin-top:9px}
.codebox pre{
  margin:0;padding:14px 14px 16px;border-radius:11px;
  background:#07080c;border:1px solid rgba(255,255,255,.07);
  max-height:286px;overflow:auto;
}
.codebox code{
  font:400 11px/1.72 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#c3cde3;white-space:pre;display:block;
}
.codebox pre::-webkit-scrollbar{width:7px;height:7px}
.codebox pre::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
.copy{
  position:absolute;top:9px;right:9px;
  background:rgba(255,255,255,.07);color:#cfd8ea;
  border:1px solid rgba(255,255,255,.12);border-radius:7px;
  padding:5px 9px;font-size:10px;font-family:inherit;cursor:pointer;
  transition:.2s;
}
.copy:hover{background:rgba(255,255,255,.14)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:var(--tx);color:var(--bg);border-radius:9px;
  padding:9px 16px;font-size:12px;opacity:0;pointer-events:none;
  transition:.28s cubic-bezier(.2,.8,.2,1);z-index:80;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 主题切换过渡 ---------- */
html.theming .top,html.theming .card,html.theming .stage,html.theming .chip,
html.theming .ingest,html.theming .ghost,html.theming .search input,
html.theming .badge,html.theming .kw,html.theming .panel{
  transition:background-color .4s var(--e-soft),color .4s var(--e-soft),
             border-color .4s var(--e-soft),transform .42s var(--e-out),
             box-shadow .42s var(--e-out);
}
#count{display:inline-block}
#count.bump{animation:ui-bump .5s var(--e-out)}
@keyframes ui-bump{0%{opacity:.2;transform:translateY(5px)}100%{opacity:1;transform:none}}

/* ---------- pause ---------- */
html[data-paused="1"] .stage *,
html[data-paused="1"] .stage *::before,
html[data-paused="1"] .stage *::after,
html[data-paused="1"] .m-stage *,
html[data-paused="1"] .m-stage *::before,
html[data-paused="1"] .m-stage *::after{
  animation-play-state:paused !important;
}
html[data-paused="1"] .aura{animation-play-state:paused}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .top{flex-wrap:wrap;padding:12px 16px;gap:12px}
  .tools{width:100%}
  .search{flex:1}
  .search input{width:100%}
  main{grid-template-columns:1fr;padding:16px 16px 48px;gap:16px}
  .rail{
    position:static;flex-direction:row;overflow-x:auto;gap:6px;
    padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail .rl{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 11px}
  .chip .n{margin-left:5px}
  .chip[aria-pressed="true"]::before{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
  .panel{grid-template-columns:1fr;max-height:92vh;overflow-y:auto}
  .p-left{border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .m-stage{height:210px}
  .p-right{padding:18px 16px 26px;overflow:visible}
  .ingest .flow{margin-left:0}
  .ptitle h2{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .mark,.aura,.top,.chip,.card,.empty,.ingest,.mbd,.panel,
  .p-right>*,.params .prow{animation:none !important}
  .card:hover,.chip:hover,.ghost:hover,.card:active,.ghost:active{transform:none}
  .stage{transition:none}
  .card::after{display:none}
}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1>动效收集器</h1>
      <p>MOTION LEXICON · <span id="count">0</span> EFFECTS</p>
    </div>
  </div>
  <div class="tools">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="搜索：边缘流光 / edge glow / 聚光" autocomplete="off">
    </div>
    <button class="ghost" id="pause" aria-pressed="false">暂停动效</button>
    <button class="ghost" id="theme">浅色</button>
  </div>
</header>

<main>
  <nav class="rail" id="rail">
    <div class="rl">CATEGORY</div>
  </nav>
  <section>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <b>没有匹配的效果</b>
      把这个词直接发给我，说「收进动效收集器」，我来命名、实现并归档。
    </div>

    <section class="ingest">
      <div>
        <h2>怎么继续投喂</h2>
        <p>把一句话、一张截图或一段视频发给我，说「收进动效收集器」。我按固定动作处理：识别 → 归类 → 中英命名 → 拆参数 → 写实现 → 归档进这个页面。</p>
        <p class="tips">不确定叫什么也没关系，描述"它看起来像什么"即可。</p>
      </div>
      <div class="flow">

    mount: function (el) {
      var box = el.querySelector('.rp-stage');
      if (!box) return;
      var spawn = function (cx, cy) {
        var r = box.getBoundingClientRect();
        var s = document.createElement('span');
        s.className = 'rp-wave';
        s.style.left = (cx - r.left) + 'px';
        s.style.top = (cy - r.top) + 'px';
        box.appendChild(s);
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1600);
      };
      var down = function (e) { spawn(e.clientX, e.clientY); };
      var click = function (e) { e.stopPropagation(); };
      var auto = setInterval(function () {
        if (document.documentElement.dataset.paused === '1') return;
        var r = box.getBoundingClientRect();
        if (!r.width) return;
        spawn(r.left + r.width * (0.25 + Math.random() * 0.5), r.top + r.height * (0.3 + Math.random() * 0.4));
      }, 2200);
      box.addEventListener('pointerdown', down);
      box.addEventListener('click', click);
      return function () {
        clearInterval(auto);
        box.removeEventListener('pointerdown', down);
        box.removeEventListener('click', click);
      };
    },

        if (!running) return;

          raf = requestAnimationFrame(step);

            start = 0;

            raf = requestAnimationFrame(step);
          }, 1400);
        }
      };
      raf = requestAnimationFrame(step);
      return function () { running = false; cancelAnimationFrame(raf); clearTimeout(timer); };

    mount: function (el) {
      var box = el.querySelector('.hs-box');
      if (!box) return;
      var items = box.children, dots = el.querySelectorAll('.hs-dots i');
      var sync = function () {
        var br = box.getBoundingClientRect(), best = 0, bd = 1e9;
        for (var k = 0; k < items.length; k++) {
          var r = items[k].getBoundingClientRect();
          var d = Math.abs((r.left + r.width / 2) - (br.left + br.width / 2));
          if (d < bd) { bd = d; best = k; }
        }
        for (var j = 0; j < dots.length; j++) dots[j].classList.toggle('on', j === best);
      };
      var jump = function (i) {
        var t = items[i];
        if (!t) return;
        box.scrollTo({ left: t.getBoundingClientRect().left - box.getBoundingClientRect().left + box.scrollLeft, behavior: 'smooth' });
      };
      box.addEventListener('scroll', sync);
      var idx = 0;
      var auto = setInterval(function () {
        if (document.documentElement.dataset.paused === '1') return;
        idx = (idx + 1) % items.length;
        jump(idx);
      }, 1800);
      return function () { clearInterval(auto); box.removeEventListener('scroll', sync); };
    },

      var box = el.querySelector('.sz-box');
      if (!box) return;
      var onScroll = function () {
        var max = box.scrollHeight - box.clientHeight;
        el.style.setProperty('--sz-p', max > 0 ? (box.scrollTop / max).toFixed(3) : 0);
      };
      box.addEventListener('scroll', onScroll);
      onScroll();
      var dir = 1;
      var auto = setInterval(function () {
        if (document.documentElement.dataset.paused === '1') return;
        var max = box.scrollHeight - box.clientHeight;
        if (max <= 0) return;
        box.scrollTop += 0.55 * dir;
        if (box.scrollTop >= max - 1) dir = -1;
        if (box.scrollTop <= 0) dir = 1;
      }, 26);
      return function () { clearInterval(auto); box.removeEventListener('scroll', onScroll); };
    },
    code: `<!-- 进度取自滚动位置，缩放值 = 1 + (1 - p) * 幅度 -->
<div class="scene" onscroll="
  this.style.setProperty('--p', this.scrollTop / (this.scrollHeight - this.clientHeight))
">
  <div class="hero"></div>
</div>

<style>
.hero{ position:sticky; top:0; height:100vh;
       transform:scale(calc(1 + (1 - var(--p,0)) * 0.6));
       transform-origin:50% 45%; will-change:transform }
</style>`,
    usage: '首屏大图、产品剖面、数据可视化引导、Apple 式叙事页。',
    note: '缩放系数超过 1.4 会明显糊（位图）；只动 transform 不动宽高；配 will-change:transform，但在低端机上要慎用，长期存在的 will-change 会吃显存。',
    variants: ['放大进入（反向，1 → 1.4）', '缩放 + 位移（镜头推轨）']
  },

  {
    id: 'back-to-top',
    name: '回到顶部',
    en: 'Back to Top',
    cat: 'scroll',
    def: '滚过一屏后浮出的小圆钮，点一下平滑回到顶部。出现和消失都要有过渡，不能突然冒出来。',
    keywords: ['回到顶部', '返回顶部', '置顶按钮', 'back to top', 'scroll to top', 'float button'],
    params: [
      { k: '--bt-s', l: '按钮直径', min: 26, max: 46, step: 2, v: 34, u: 'px' }
    ],
    stage: '<div class="bt-box"><div class="bt-page"><h4>CONTENTS</h4><p>往下滚，右下角会出现返回顶部的按钮。</p><p>它只在滚过一屏后出现，避免首屏就挡住内容。</p><p>点一下是平滑回顶，不是瞬间跳转。</p><p>回到顶部后按钮自己淡出。</p><p>长页面必备，短页面不用加。</p><button class="bt-btn" type="button" aria-label="回到顶部">↑</button></div></div>',
    css: `
.bt-box{position:relative;width:214px;height:140px;overflow-y:auto;border-radius:12px;
  background:#07090f;border:1px solid rgba(255,255,255,.07);scrollbar-width:none}
.bt-box::-webkit-scrollbar{width:0;height:0}
.bt-page{position:relative;padding:14px 14px 16px;min-height:100%;box-sizing:border-box}
.bt-page h4{margin:0 0 8px;font:600 11px/1.2 ui-monospace,monospace;
  letter-spacing:.16em;color:#cfd8ef}
.bt-page p{margin:0 0 10px;font:400 10px/1.75 inherit;color:#7d879e}
.bt-btn{position:sticky;bottom:10px;display:grid;place-items:center;
  width:var(--bt-s,34px);height:var(--bt-s,34px);margin:14px 0 0 auto;
  border-radius:50%;border:1px solid rgba(120,160,255,.35);cursor:pointer;
  background:rgba(24,32,54,.9);color:#c9d8ff;font:400 13px/1 inherit;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 8px 22px rgba(0,0,0,.5);
  opacity:0;transform:translateY(8px) scale(.9);pointer-events:none;
  transition:opacity .3s,transform .34s cubic-bezier(.22,1,.36,1),border-color .2s}
.bt-on .bt-btn{opacity:1;transform:none;pointer-events:auto}
.bt-on .bt-btn:hover{border-color:rgba(120,160,255,.7)}
.bt-on .bt-btn:active{transform:scale(.94)}`,
    mount: function (el) {
      var box = el.querySelector('.bt-box');
      var btn = el.querySelector('.bt-btn');
      if (!box || !btn) return;
      box.addEventListener('scroll', function () {
        el.classList.toggle('bt-on', box.scrollTop > 40);
      });
      btn.addEventListener('click', function () {
        box.scrollTo({ top: 0, behavior: 'smooth' });
      });
      var phase = 'down', wait = 0;
      var auto = setInterval(function () {
        if (document.documentElement.dataset.paused === '1') return;
        var max = box.scrollHeight - box.clientHeight;
        if (max <= 0) return;
        if (phase === 'down') {
          box.scrollTop = Math.min(max, box.scrollTop + 1.1);
          if (box.scrollTop >= max - 1) { phase = 'hold'; wait = 900; }
        } else if (phase === 'hold') {
          wait -= 40;
          if (wait <= 0) { btn.click(); phase = 'up'; }
        } else if (box.scrollTop <= 1) {
          phase = 'down';
        }
      }, 40);
      return function () { clearInterval(auto); };
    },
    code: `<!-- 滚过阈值再显示，点一下平滑回顶 -->
<div class="page" onscroll="
  document.body.classList.toggle('show-top', this.scrollTop > 400)
">...</div>
<button class="top" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</button>

<style>
.top{ position:fixed; right:24px; bottom:24px; width:44px; height:44px;
      border-radius:50%; opacity:0; transform:translateY(8px);
      transition:opacity .3s, transform .34s cubic-bezier(.22,1,.36,1) }
.show-top .top{ opacity:1; transform:none }
</style>`,
    usage: '长文、列表流、搜索结果、移动端详情页。',
    note: '阈值按一屏高度定，别一滚就冒；用 smooth 而不是瞬间跳，否则会丢失位置感；按钮要避开底部固定导航和系统手势区。',
    variants: ['环形进度 + 回顶（滚动位置可视化）', '到达底部才出现的「回顶」文字链']
  }

];

if (typeof window !== 'undefined') {
  window.CATEGORIES = CATEGORIES;
  window.EFFECTS = EFFECTS;
}

</script>
<script>
(function () {
  'use strict';

  var grid = document.getElementById('grid');
  var rail = document.getElementById('rail');
  var empty = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var modal = document.getElementById('modal');
  var mStage = document.getElementById('m-stage');
  var mParams = document.getElementById('m-params');
  var mBody = document.getElementById('m-body');
  var toast = document.getElementById('toast');

  var state = { q: '', cat: 'all' };
  var lastCount = -1;
  var cardCleanups = [];
  var modalCleanup = null;

  /* ---------- helpers ---------- */
  function catOf(id) {
    for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i];
    return { name: id, en: id };
  }
  function defaults(fx) {
    var o = {};
    fx.params.forEach(function (p) { o[p.k] = p.v; });
    return o;
  }
  function applyParams(el, fx, vals) {
    fx.params.forEach(function (p) {
      var v = (vals && vals[p.k] != null) ? vals[p.k] : p.v;
      el.style.setProperty(p.k, v + (p.u || ''));
    });
  }
  function mountInto(el, fx, vals) {
    el.innerHTML = fx.stage;
    applyParams(el, fx, vals);
    if (typeof fx.mount === 'function') {
      var c = fx.mount(el);
      return typeof c === 'function' ? c : null;
    }
    return null;
  }
  function clearCards() {
    cardCleanups.forEach(function (f) { try { f(); } catch (e) {} });
    cardCleanups = [];
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function matches(fx, q) {
    if (!q) return true;
    var hay = [fx.name, fx.en, fx.def, fx.id, catOf(fx.cat).name]
      .concat(fx.keywords || []).concat(fx.variants || []).join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every(function (t) { return hay.indexOf(t) > -1; });
  }

  /* ---------- 注入所有效果的 CSS（只做一次） ---------- */
  function injectStyles() {
    if (document.getElementById('fx-styles')) return;
    var s = document.createElement('style');
    s.id = 'fx-styles';
    s.textContent = EFFECTS.map(function (fx) { return '/* ' + fx.id + ' */\n' + fx.css; }).join('\n\n');
    document.head.appendChild(s);
  }

  /* ---------- rail ---------- */
  function renderRail() {
    var list = [{ id: 'all', name: '全部' }].concat(CATEGORIES);
    rail.innerHTML = '<div class="rl">CATEGORY</div>' + list.map(function (c) {
      var n = c.id === 'all' ? EFFECTS.length : EFFECTS.filter(function (f) { return f.cat === c.id; }).length;
      return '<button class="chip" data-cat="' + c.id + '" aria-pressed="' + (state.cat === c.id) + '">'
        + c.name + '<span class="n">' + n + '</span></button>';
    }).join('');
    var chips = rail.querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) chips[i].style.setProperty('--d', (60 + i * 26) + 'ms');
  }

  /* ---------- grid ---------- */
  function cardHTML(fx) {
    var kws = (fx.keywords || []).slice(0, 1);
    var more = (fx.keywords || []).length - 1;
    return '<article class="card" data-id="' + fx.id + '">'
      + '<div class="stage" data-stage="' + fx.id + '"></div>'
      + '<div class="card-body">'
      +   '<div class="card-top"><h3>' + fx.name + '</h3><span class="badge">' + catOf(fx.cat).name + '</span></div>'
      +   '<p class="card-en">' + fx.en + '</p>'
      +   '<p class="card-def">' + fx.def + '</p>'
      +   '<div class="card-foot">'
      +     kws.map(function (k) { return '<span class="kw">' + k + '</span>'; }).join('')
      +     (more > 0 ? '<span class="kw more">+' + more + '</span>' : '')
      +     '<button class="tune">调参 ↗</button>'
      +   '</div>'
      + '</div></article>';
  }

  function render() {
    clearCards();
    var order = CATEGORIES.map(function (c) { return c.id; });
    var list = EFFECTS.filter(function (fx) {
      return (state.cat === 'all' || fx.cat === state.cat) && matches(fx, state.q);
    }).sort(function (a, b) {
      return order.indexOf(a.cat) - order.indexOf(b.cat);
    });
    grid.innerHTML = list.map(cardHTML).join('');
    list.forEach(function (fx) {
      var el = grid.querySelector('[data-stage="' + fx.id + '"]');
      if (!el) return;
      var c = mountInto(el, fx, defaults(fx));
      if (c) cardCleanups.push(c);
    });
    empty.hidden = list.length > 0;
    countEl.textContent = list.length;
    countEl.classList.remove('bump');
    void countEl.offsetWidth;
    if (list.length !== lastCount) countEl.classList.add('bump');
    lastCount = list.length;
    var cards = grid.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) cards[i].style.setProperty('--d', Math.min(i, 9) * 32 + 'ms');
    Array.prototype.forEach.call(rail.querySelectorAll('.chip'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat));
    });
  }

  /* ---------- modal ---------- */
  function openModal(fx) {
    if (modalCleanup) { try { modalCleanup(); } catch (e) {} modalCleanup = null; }
    clearTimeout(closeTimer);
    modal.classList.remove('closing');
    mStage.removeAttribute('style');
    var vals = defaults(fx);

    mParams.innerHTML = fx.params.map(function (p) {
      return '<label class="prow">'
        + '<span class="pl">' + p.l + '</span>'
        + '<input type="range" min="' + p.min + '" max="' + p.max + '" step="' + p.step + '" value="' + p.v + '" data-k="' + p.k + '" data-u="' + (p.u || '') + '" data-l="' + p.l + '">'
        + '<span class="pv" data-pv="' + p.k + '">' + p.v + (p.u || '') + '</span>'
        + '</label>';
    }).join('');

    mBody.innerHTML =
      '<div class="ptitle"><h2 id="mtitle">' + fx.name + '</h2><span>' + fx.en + '</span></div>'
      + '<p class="pdef">' + fx.def + '</p>'
      + '<div class="sect"><h3>触发词 / AI KEYWORDS</h3><div class="tags">'
      +   (fx.keywords || []).map(function (k) { return '<span class="tag">' + k + '</span>'; }).join('')
      + '</div></div>'
      + '<div class="sect"><h3>适用场景</h3><p class="note">' + fx.usage + '</p></div>'
      + '<div class="sect"><h3>实现要点 / 常见坑</h3><p class="note">' + fx.note + '</p></div>'
      + (fx.variants && fx.variants.length
          ? '<div class="sect"><h3>变体</h3><div class="tags">'
            + fx.variants.map(function (v) { return '<span class="tag">' + v + '</span>'; }).join('')
            + '</div></div>' : '')
      + '<div class="sect"><h3>复制即用</h3><div class="codebox">'
      +   '<button class="copy" data-copy>复制</button>'
      +   '<pre><code>' + esc(fx.code) + '</code></pre>'
      + '</div></div>';

    modalCleanup = mountInto(mStage, fx, vals);

    Array.prototype.forEach.call(mParams.querySelectorAll('input'), function (inp) {
      inp.addEventListener('input', function () {
        var k = inp.dataset.k, v = parseFloat(inp.value);
        mStage.style.setProperty(k, v + inp.dataset.u);
        var out = mParams.querySelector('[data-pv="' + k + '"]');
        if (out) out.textContent = v + inp.dataset.u;
      });
    });

    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  var closeTimer;
  function closeModal() {
    if (modal.hidden) return;
    document.body.style.overflow = '';
    if (modalCleanup) { try { modalCleanup(); } catch (e) {} modalCleanup = null; }
    modal.classList.add('closing');
    clearTimeout(closeTimer);
    closeTimer = setTimeout(function () {
      modal.hidden = true;
      modal.classList.remove('closing');
      mStage.innerHTML = '';
    }, 170);
  }

  /* ---------- toast ---------- */
  var toastTimer;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('on'); }, 1600);
  }

  /* ---------- 卡片跟随鼠标的柔光 ---------- */
  var spotEl = null, spotX = 0, spotY = 0, spotRaf = 0;
  grid.addEventListener('pointermove', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    spotEl = card; spotX = e.clientX; spotY = e.clientY;
    if (spotRaf) return;
    spotRaf = requestAnimationFrame(function () {
      spotRaf = 0;
      if (!spotEl) return;
      var r = spotEl.getBoundingClientRect();
      spotEl.style.setProperty('--mx', (spotX - r.left) + 'px');
      spotEl.style.setProperty('--my', (spotY - r.top) + 'px');
    });
  });

  /* ---------- 滚动时顶栏加重 ---------- */
  var topbar = document.querySelector('.top');
  function syncTop() { topbar.classList.toggle('scrolled', window.scrollY > 6); }
  window.addEventListener('scroll', syncTop, { passive: true });
  syncTop();

  /* ---------- events ---------- */
  rail.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    state.cat = b.dataset.cat;
    render();
  });

  var qTimer;
  document.getElementById('q').addEventListener('input', function (e) {
    clearTimeout(qTimer);
    var v = e.target.value.trim();
    qTimer = setTimeout(function () { state.q = v; render(); }, 110);
  });

  grid.addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    var fx = EFFECTS.filter(function (f) { return f.id === card.dataset.id; })[0];
    if (fx) openModal(fx);
  });

  modal.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closeModal(); return; }
    var c = e.target.closest('[data-copy]');
    if (c) {
      var code = mBody.querySelector('code').textContent;
      var done = function () { c.textContent = '已复制'; say('代码已复制'); setTimeout(function () { c.textContent = '复制'; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, fallback);
      } else { fallback(); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (err) { say('复制失败，请手动选中'); }
        document.body.removeChild(ta);
      }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!modal.hidden) closeModal();
      else document.activeElement.blur();
    }
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      document.getElementById('q').focus();
    }
  });

  /* theme */
  var root = document.documentElement;
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('mfx-theme'); } catch (e) {}
  if (savedTheme) root.dataset.theme = savedTheme;

  var themeBtn = document.getElementById('theme');
  function syncThemeBtn() { themeBtn.textContent = root.dataset.theme === 'dark' ? '浅色' : '深色'; }
  syncThemeBtn();
  var themeTimer;
  themeBtn.addEventListener('click', function () {
    root.classList.add('theming');
    clearTimeout(themeTimer);
    themeTimer = setTimeout(function () { root.classList.remove('theming'); }, 480);
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('mfx-theme', root.dataset.theme); } catch (e) {}
    syncThemeBtn();
  });

  /* pause —— 不因系统"减少动效"自动暂停：这是一个动效展示页，默认必须能看见动 */
  var pauseBtn = document.getElementById('pause');
  pauseBtn.addEventListener('click', function () {
    var p = root.dataset.paused === '1';
    root.dataset.paused = p ? '0' : '1';
    pauseBtn.setAttribute('aria-pressed', String(!p));
    pauseBtn.textContent = p ? '暂停动效' : '继续动效';
  });

  /* init */
  injectStyles();
  renderRail();
  render();
})();
</script>
</body>
</html>
